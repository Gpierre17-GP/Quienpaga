name: Limpiar Deployments Antiguos

on:
  # Se ejecuta automáticamente cada vez que subes archivos nuevos
  push:
    branches:
      - main  # Cambia a 'master' si tu rama principal se llama así

jobs:
  clean-up:
    runs-on: ubuntu-latest
    steps:
      - name: Eliminar despliegues obsoletos
        uses: int128/delete-deployments-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Mantiene solo el último deployment activo y borra los demás
          keep-latest: 1 
