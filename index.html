<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#DD4B14">
<title>QuiénPaga</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="QuiénPaga">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#CFE8FF;color:#1B1340}
.w{max-width:520px;margin:0 auto;padding-bottom:40px}
header{background:#DD4B14;color:#fff;padding:18px 16px}
header input{margin:10px 0 0}
h1{margin:0;font-size:20px;font-weight:600}
.tot{background:#FFD23F;border-radius:12px;padding:12px 14px;margin-top:12px;display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:#4A3500}
.tot b{font-size:26px;color:#1B1340}
section{padding:14px 14px 0}
h2{font-size:14px;font-weight:600;color:#A8360B;margin:0 0 8px}
.c{background:#fff;border-radius:12px;padding:12px}
input[type=text],input:not([type]),select{width:100%;font-size:16px;padding:10px;border:1.5px solid #B9D6F2;border-radius:10px;background:#fff;color:#1B1340;margin-bottom:8px}
input:focus,select:focus,button:focus-visible{outline:3px solid #FF3D8B;outline-offset:1px}
button{font:inherit;font-size:15px;font-weight:600;border:0;border-radius:12px;padding:12px;cursor:pointer;color:#fff;background:#DD4B14}
.full{width:100%}
.g{background:#25D366;color:#08301A}
.o{background:#5B6B85}
.seg{display:flex;gap:6px;margin-bottom:8px}
.seg button{flex:1;background:#FFE1D1;color:#A8360B;padding:10px}
.seg button.on{background:#DD4B14;color:#fff}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.row label{display:flex;align-items:center;gap:8px;font-size:15px;flex:1}
.row input[type=checkbox]{width:20px;height:20px;margin:0}
.row .ex{width:110px;margin:0}
.chip{display:inline-flex;align-items:center;gap:6px;color:#fff;border-radius:20px;padding:6px 10px;margin:0 6px 6px 0;font-size:14px;font-weight:600}
.chip button{background:none;padding:0 0 0 2px;font-size:18px;line-height:1;border-radius:0}
.add{display:flex;gap:8px;margin-top:6px}
.add input{margin:0}
.add button{flex:none;padding:10px 16px}
.err{color:#D6203A;font-size:13px;font-weight:600;min-height:18px;margin:2px 0 6px}
.mut{color:#5B6B85;font-size:14px}
.e{border-bottom:1px solid #E6EEF8;padding:9px 0}
.e:last-child{border:0}
.e .t{display:flex;justify-content:space-between;font-weight:600}
.e .s{font-size:12px;color:#5B4B8A;margin-top:2px}
.e .b{margin-top:6px;display:flex;gap:8px}
.e .b button{font-size:12px;padding:5px 10px;border-radius:8px}
.e .b .d{background:#FF4D5E}
.av{display:inline-flex;width:32px;height:32px;border-radius:50%;color:#fff;font-size:12px;font-weight:600;align-items:center;justify-content:center;margin-right:10px;vertical-align:middle}
.pill{color:#fff;font-weight:600;font-size:13px;padding:4px 10px;border-radius:20px;white-space:nowrap}
.pay{background:#1B1340;color:#fff;border-radius:12px;padding:11px 14px;margin-bottom:8px;display:flex;justify-content:space-between;gap:8px}
.pay b{color:#FFD23F;white-space:nowrap}
.pay small{display:block;font-size:12px;font-weight:400;color:#B9C6E8}
.acts{display:flex;gap:8px;padding:16px 14px 0}
.acts button{flex:1}
.pc{background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:8px}
.pc.open{border:2px solid #DD4B14;padding:8px 10px 12px}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer}
.ph .l{display:flex;align-items:center;gap:10px;min-width:0}
.ph .l .av{margin:0;flex-shrink:0}
.ph .r{display:flex;align-items:center;gap:6px;flex-shrink:0}
.ph p{margin:0}
.ph .pn{font-size:14px;font-weight:600}
.ph .ps{font-size:12px;color:#5B6B85}
.pd{border-top:1px solid #D8E3F0;margin-top:10px;padding-top:4px}
.pd h4{margin:10px 0 6px;font-size:12px;font-weight:600}
.ln{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:3px 0}
.ln small{color:#5B6B85}
.net{border-radius:8px;padding:8px 10px;margin-top:10px;display:flex;justify-content:space-between;font-size:13px;font-weight:600}
.msg{background:#E7F8D9;border-radius:10px;padding:10px 12px;margin-top:12px;font-size:12px;line-height:1.55;color:#1E3A12;white-space:pre-wrap}
.msg small{display:block;font-size:11px;color:#46633A;margin-bottom:4px}
.pb{display:flex;gap:8px;margin-top:12px}
.pb button{flex:1}
details{border:1.5px dashed #8FB4DB;border-radius:12px;padding:10px 12px;margin-top:4px}
summary{cursor:pointer;font-size:13px;color:#3A4A66;list-style:none}
summary::-webkit-details-marker{display:none}
details[open] summary{margin-bottom:10px}
details .acts{padding:10px 0 0}
.sw{display:flex;align-items:center;gap:10px;margin:0 0 4px;font-size:14px;font-weight:600;cursor:pointer}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.trk{width:42px;height:24px;border-radius:12px;background:#9FB4CC;position:relative;flex-shrink:0}
.trk::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff}
.sw input:checked + .trk{background:#00B88A}
.sw input:checked + .trk::after{left:21px}
.sw input:focus-visible + .trk{outline:3px solid #FF3D8B;outline-offset:2px}
.ln.tap{cursor:pointer}
.dt{background:#F3F7FC;border-radius:8px;padding:6px 10px;margin:2px 0 6px;font-size:13px;color:#3A4A66}
.dt div{padding:2px 0}
.rst{display:block;margin:18px auto 0;background:none;color:#A8360B;text-decoration:underline;font-weight:400;font-size:13px}
</style>
</head>
<body>
<div class="w">
<header>
  <h1>QuiénPaga</h1>
  <input id="gn" type="text" maxlength="30" placeholder="Nombre del grupo, ej. Cena en Barranco" autocomplete="off" aria-label="Nombre del grupo">
  <div class="tot"><span>Total del grupo</span><b id="tot">S/ 0.00</b></div>
</header>

<section>
  <h2>Personas</h2>
  <div class="c">
    <div id="chips"></div>
    <div class="add">
      <input id="pn" type="text" maxlength="20" placeholder="Nombre, ej. Ana" autocomplete="off">
      <button id="addp">Agregar</button>
    </div>
    <div class="err" id="perr"></div>
  </div>
</section>

<section>
  <h2 id="ftitle">Nuevo gasto</h2>
  <div class="c">
    <input id="desc" type="text" maxlength="40" placeholder="¿Qué se pagó? Ej. Cena" autocomplete="off">
    <input id="amt" inputmode="decimal" placeholder="Monto en soles, ej. 100.00" autocomplete="off">
    <select id="payer" aria-label="Quién pagó"></select>
    <div class="seg">
      <button id="m-equal" class="on">Partes iguales</button>
      <button id="m-exact">Montos exactos</button>
    </div>
    <div id="parts"></div>
    <div class="err" id="err"></div>
    <button id="save" class="full">Agregar gasto</button>
    <button id="cancel" class="full o" style="display:none;margin-top:8px">Cancelar edición</button>
  </div>
</section>

<section>
  <h2>Gastos</h2>
  <div class="c" id="exps"></div>
</section>

<section>
  <h2>Saldos</h2>
  <div class="c" id="bals"></div>
</section>

<section>
  <h2>Para saldar cuentas</h2>
  <div class="seg" id="smodes">
    <button data-s="pair">Por pares</button>
    <button data-s="exp">Por gasto</button>
    <button data-s="min">Mínimo</button>
  </div>
  <p class="mut" id="shint" style="margin:0 0 8px"></p>
  <h2 style="margin-top:6px">Resumen por persona</h2>
  <p class="mut" style="margin:0 0 8px">Toca a alguien para ver y enviar solo lo suyo.</p>
  <label class="sw" id="detWrap"><input type="checkbox" id="detTog"><span class="trk"></span><span>Mensaje detallado</span></label>
  <p class="mut" id="detHint" style="margin:0 0 8px"></p>
  <div id="pcards"></div>
  <details id="full">
    <summary>Ver lista completa (<span id="ncount">0</span> transferencias)</summary>
    <div id="pays"></div>
    <div class="acts">
      <button id="copy">Copiar todo</button>
      <button id="wa" class="g">WhatsApp todo</button>
    </div>
  </details>
</section>

<button id="reset" class="rst">Borrar todo y empezar de nuevo</button>
</div>

<script>
var K = 'dividir-gastos-v1';
var COLORS = ['#DD4B14', '#FF3D8B', '#0E9AA7', '#00B88A', '#2D8CFF', '#E0245E'];
var S = { people: [], expenses: [] };
var edit = null, mode = 'equal', sel = new Set(), ex = {}, openId = null, openLine = null;

try { var raw = localStorage.getItem(K); if (raw) S = JSON.parse(raw); } catch (e) {}
if (!S.people || !S.expenses) S = { people: [], expenses: [] };
if (typeof S.group !== 'string') S.group = '';
if (['min', 'pair', 'exp'].indexOf(S.settle) < 0) S.settle = 'pair';
if (typeof S.detail !== 'boolean') S.detail = false;
S.people.forEach(function (p) { sel.add(p.id); });

function save() { try { localStorage.setItem(K, JSON.stringify(S)); } catch (e) {} }
function $(id) { return document.getElementById(id); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function col(i) { return COLORS[i % COLORS.length]; }
function ini(n) { return esc(n.trim().slice(0, 2).toUpperCase()); }
function nm(id) { var p = S.people.find(function (x) { return x.id === id; }); return p ? p.name : '?'; }

// Dinero: todo en céntimos (enteros) para evitar errores de decimales.
function cents(v) {
  v = String(v).trim().replace(',', '.');
  if (!/^\d+(\.\d{1,2})?$/.test(v)) return null;
  var p = v.split('.');
  return parseInt(p[0], 10) * 100 + parseInt((p[1] || '') + '00'.slice((p[1] || '').length), 10) % 100;
}
function money(c) {
  return 'S/ ' + (c / 100).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function signed(c) { return (c < 0 ? '− ' : c > 0 ? '+ ' : '') + money(Math.abs(c)); }

// Reparto: el sobrante de céntimos se asigna de a 1 a las primeras personas.
function shares(e) {
  var o = {};
  if (e.mode === 'exact') { for (var k in e.exact) o[k] = e.exact[k]; return o; }
  var n = e.parts.length, base = Math.floor(e.amount / n), rem = e.amount - base * n;
  e.parts.forEach(function (id, i) { o[id] = base + (i < rem ? 1 : 0); });
  return o;
}
function balances() {
  var b = {};
  S.people.forEach(function (p) { b[p.id] = 0; });
  S.expenses.forEach(function (e) {
    b[e.payer] += e.amount;
    var s = shares(e);
    for (var id in s) b[id] -= s[id];
  });
  return b;
}
function names(l) {
  var n = [];
  l.forEach(function (y) { if (n.indexOf(y.d) < 0) n.push(y.d); });
  return n.length <= 2 ? n.join(', ') : n[0] + ', ' + n[1] + ' y ' + (n.length - 2) + ' más';
}
function why(p, m) { return names(p) + (m.length ? ', menos ' + names(m) : ''); }
function detailRows(x, payer) {
  var r = [];
  x[4].p.forEach(function (y) { r.push(y.d + ': ' + (payer ? 'le debes ' : 'te debe ') + money(y.a)); });
  x[4].m.forEach(function (y) { r.push(y.d + ': ' + (payer ? 'te debe ' : 'le debes ') + money(y.a)); });
  return r;
}
function addLine(L, x, who, payer, det) {
  if (det && x[4]) {
    L.push('- ' + money(x[2]) + ' ' + who + ':');
    detailRows(x, payer).forEach(function (r) { L.push('  ' + r); });
  } else L.push('- ' + money(x[2]) + ' ' + who + (x[3] ? ' (' + x[3] + ')' : ''));
}
function ix(id) { return S.people.findIndex(function (p) { return p.id === id; }); }
// Tres formas de saldar: 'min' (pocas transferencias), 'pair' (se restan las deudas
// entre cada par de personas) y 'exp' (cada uno le paga a quien pagó cada gasto).
function transfers(mode) {
  var out = [];
  if (mode === 'exp') {
    S.expenses.forEach(function (e) {
      var s = shares(e);
      S.people.forEach(function (p) {
        if (p.id !== e.payer && s[p.id]) out.push([p.id, e.payer, s[p.id], e.desc]);
      });
    });
    return out;
  }
  if (mode === 'pair') {
    var o = {};
    S.expenses.forEach(function (e) {
      var s = shares(e);
      for (var id in s) {
        if (id === e.payer) continue;
        var k = id + '>' + e.payer;
        (o[k] = o[k] || []).push({ d: e.desc, a: s[id] });
      }
    });
    var tot = function (l) { return l.reduce(function (t, y) { return t + y.a; }, 0); };
    var ids = S.people.map(function (p) { return p.id; });
    for (var i = 0; i < ids.length; i++) {
      for (var j = i + 1; j < ids.length; j++) {
        var ab = o[ids[i] + '>' + ids[j]] || [], ba = o[ids[j] + '>' + ids[i]] || [], n = tot(ab) - tot(ba);
        if (n > 0) out.push([ids[i], ids[j], n, why(ab, ba), { p: ab, m: ba }]);
        else if (n < 0) out.push([ids[j], ids[i], -n, why(ba, ab), { p: ba, m: ab }]);
      }
    }
    out.sort(function (x, y) { return ix(x[0]) - ix(y[0]) || ix(x[1]) - ix(y[1]); });
    return out;
  }
  return settle(balances());
}
// Liquidación: empareja al que más debe con al que más le deben.
function settle(b) {
  var d = [], c = [], out = [], i = 0, j = 0;
  S.people.forEach(function (p) {
    if (b[p.id] < 0) d.push([p.id, -b[p.id]]);
    else if (b[p.id] > 0) c.push([p.id, b[p.id]]);
  });
  d.sort(function (x, y) { return y[1] - x[1]; });
  c.sort(function (x, y) { return y[1] - x[1]; });
  while (i < d.length && j < c.length) {
    var m = Math.min(d[i][1], c[j][1]);
    out.push([d[i][0], c[j][0], m]);
    d[i][1] -= m; c[j][1] -= m;
    if (!d[i][1]) i++;
    if (!c[j][1]) j++;
  }
  return out;
}


var DOWN = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6B85" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
var UP = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6B85" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>';

// Resumen por persona: lo que cada uno paga y recibe según las transferencias del modo elegido.
function pinfo(id, st) {
  var pay = [], rec = [], pt = 0, rt = 0;
  st.forEach(function (x) {
    if (x[0] === id) { pay.push(x); pt += x[2]; }
    if (x[1] === id) { rec.push(x); rt += x[2]; }
  });
  return { pay: pay, rec: rec, net: rt - pt };
}
function cnt(list, k) { var u = {}; list.forEach(function (x) { u[x[k]] = 1; }); return Object.keys(u).length; }
function plural(n) { return n + (n === 1 ? ' persona' : ' personas'); }
function personMsg(id, st) {
  var f = pinfo(id, st), det = S.detail && S.settle === 'pair';
  var L = ['Hola ' + nm(id) + ', tu resumen de ' + (S.group ? '*' + S.group + '*' : 'los gastos del grupo') + ':'];
  if (!f.pay.length && !f.rec.length) { L.push('No tienes pagos pendientes.'); return L.join('\n'); }
  if (f.pay.length) {
    L.push('Pagas:');
    f.pay.forEach(function (x) { addLine(L, x, 'a ' + nm(x[1]), true, det); });
  }
  if (f.rec.length) {
    L.push('Recibes:');
    f.rec.forEach(function (x) { addLine(L, x, 'de ' + nm(x[0]), false, det); });
  }
  L.push(f.net < 0 ? 'Saldo final: pagas ' + money(-f.net) : f.net > 0 ? 'Saldo final: recibes ' + money(f.net) : 'Saldo final: estás al día');
  return L.join('\n');
}
function lines(arr, k) {
  return arr.map(function (x) {
    var key = x[0] + '>' + x[1], has = !!x[4], open = has && openLine === key;
    var h = '<div class="ln' + (has ? ' tap' : '') + '"' + (has ? ' data-ln="' + key + '" role="button" tabindex="0" aria-expanded="' + open + '"' : '') + '><span>' + (k === 1 ? 'a ' : 'de ') + esc(nm(x[k])) + (x[3] ? ' <small>(' + esc(x[3]) + ')</small>' : '') + '</span><b>' + money(x[2]) + '</b></div>';
    if (open) h += '<div class="dt">' + detailRows(x, k === 1).map(function (r) { return '<div>' + esc(r) + '</div>'; }).join('') + '</div>';
    return h;
  }).join('');
}
function renderPeople(st) {
  if (!S.people.length || !S.expenses.length) {
    $('pcards').innerHTML = '<div class="c mut">Agrega gastos para ver el resumen de cada persona.</div>';
    return;
  }
  $('pcards').innerHTML = S.people.map(function (p, i) {
    var f = pinfo(p.id, st), open = openId === p.id, none = !f.pay.length && !f.rec.length;
    var sub = none ? 'Sin pagos pendientes'
      : f.pay.length && f.rec.length ? 'Paga a ' + cnt(f.pay, 1) + ' · recibe de ' + cnt(f.rec, 0)
      : f.pay.length ? 'Paga a ' + plural(cnt(f.pay, 1)) : 'Recibe de ' + plural(cnt(f.rec, 0));
    var pill = '<span class="pill" style="background:' + (f.net > 0 ? '#00B88A' : f.net < 0 ? '#FF4D5E' : '#8A94A6') + '">' + (f.net === 0 ? 'Al día' : signed(f.net)) + '</span>';
    var h = '<div class="pc' + (open ? ' open' : '') + '"><div class="ph" data-open="' + p.id + '" role="button" tabindex="0" aria-expanded="' + open + '">' +
      '<div class="l"><span class="av" style="background:' + col(i) + '">' + ini(p.name) + '</span><div><p class="pn">' + esc(p.name) + '</p><p class="ps">' + sub + '</p></div></div>' +
      '<div class="r">' + pill + (open ? UP : DOWN) + '</div></div>';
    if (open) {
      var nc = f.net < 0 ? ['#FFE9EB', '#8A1F2B', 'Paga ' + money(-f.net)] : f.net > 0 ? ['#DFF7EE', '#0B5E47', 'Recibe ' + money(f.net)] : ['#EEF1F5', '#3A4A66', 'Al día'];
      h += '<div class="pd">';
      if (f.pay.length) h += '<h4 style="color:#A8360B">Debe pagar</h4>' + lines(f.pay, 1);
      if (f.rec.length) h += '<h4 style="color:#0B7A5C">Debe recibir</h4>' + lines(f.rec, 0);
      h += '<div class="net" style="background:' + nc[0] + ';color:' + nc[1] + '"><span>Saldo final</span><span>' + nc[2] + '</span></div>' +
        '<div class="msg"><small>Mensaje que se envía</small>' + esc(personMsg(p.id, st)) + '</div>' +
        '<div class="pb"><button data-copy="' + p.id + '">Copiar</button><button class="g" data-wa="' + p.id + '">WhatsApp</button></div></div>';
    }
    return h + '</div>';
  }).join('');
}

function renderPayer() {
  var cur = $('payer').value;
  $('payer').innerHTML = S.people.map(function (p) {
    return '<option value="' + p.id + '">Pagó ' + esc(p.name) + '</option>';
  }).join('');
  if (S.people.some(function (p) { return p.id === cur; })) $('payer').value = cur;
}
function renderParts() {
  $('parts').innerHTML = S.people.map(function (p) {
    var on = sel.has(p.id);
    return '<div class="row"><label><input type="checkbox" data-p="' + p.id + '"' + (on ? ' checked' : '') + '> ' + esc(p.name) + '</label>' +
      (mode === 'exact' && on ? '<input class="ex" data-e="' + p.id + '" inputmode="decimal" placeholder="0.00" value="' + esc(ex[p.id] || '') + '" aria-label="Monto de ' + esc(p.name) + '">' : '') + '</div>';
  }).join('') || '<span class="mut">Agrega al menos 2 personas para empezar.</span>';
}
function render() {
  var tot = S.expenses.reduce(function (a, e) { return a + e.amount; }, 0);
  $('tot').textContent = money(tot);
  $('chips').innerHTML = S.people.map(function (p, i) {
    return '<span class="chip" style="background:' + col(i) + '">' + esc(p.name) + '<button data-del="' + p.id + '" aria-label="Quitar ' + esc(p.name) + '">×</button></span>';
  }).join('') || '<span class="mut">Aún no hay personas.</span>';
  renderPayer(); renderParts();

  $('exps').innerHTML = S.expenses.length ? S.expenses.map(function (e) {
    var s = shares(e);
    var det = S.people.filter(function (p) { return s[p.id] !== undefined; }).map(function (p) {
      return esc(p.name) + ' ' + (s[p.id] / 100).toFixed(2);
    }).join(' · ');
    return '<div class="e"><div class="t"><span>' + esc(e.desc) + '</span><span>' + money(e.amount) + '</span></div>' +
      '<div class="s">Pagó ' + esc(nm(e.payer)) + ' · ' + det + '</div>' +
      '<div class="b"><button data-edit="' + e.id + '">Editar</button><button class="d" data-rm="' + e.id + '">Eliminar</button></div></div>';
  }).join('') : '<span class="mut">Sin gastos todavía. Agrega el primero arriba.</span>';

  var b = balances();
  $('bals').innerHTML = S.people.map(function (p, i) {
    var v = b[p.id];
    return '<div class="row"><span><span class="av" style="background:' + col(i) + '">' + ini(p.name) + '</span>' + esc(p.name) + '</span>' +
      '<span class="pill" style="background:' + (v > 0 ? '#00B88A' : v < 0 ? '#FF4D5E' : '#8A94A6') + '">' + signed(v) + '</span></div>';
  }).join('') || '<span class="mut">Sin personas.</span>';

  var st = transfers(S.settle);
  renderPeople(st);
  $('ncount').textContent = st.length;
  var HINTS = { min: 'Pocas transferencias: puede que pagues a alguien distinto de quien pagó tu parte.', pair: 'Cada par de personas resta lo que se deben entre sí y paga solo la diferencia. Toca un pago para ver el detalle.', exp: 'Cada uno le paga a quien pagó cada gasto, tal cual.' };
  Array.prototype.forEach.call($('smodes').children, function (bt) { bt.className = bt.getAttribute('data-s') === S.settle ? 'on' : ''; });
  $('shint').textContent = HINTS[S.settle];
  var isPair = S.settle === 'pair';
  $('detWrap').style.display = isPair ? 'flex' : 'none';
  $('detHint').style.display = isPair ? 'block' : 'none';
  $('detTog').checked = S.detail;
  $('detHint').textContent = S.detail ? 'Cada pago del mensaje incluye su desglose por gasto.' : 'Cada pago del mensaje incluye solo el motivo corto.';
  $('pays').innerHTML = st.length ? st.map(function (x) {
    return '<div class="pay"><span>' + esc(nm(x[0])) + ' le paga a ' + esc(nm(x[1])) + (x[3] ? '<small>' + esc(x[3]) + '</small>' : '') + '</span><b>' + money(x[2]) + '</b></div>';
  }).join('') : '<div class="c mut">' + (S.expenses.length ? 'Todo saldado.' : 'Agrega gastos para ver quién paga a quién.') + '</div>';
  save();
}

function perr(m) { $('perr').textContent = m || ''; }
function err(m) { $('err').textContent = m || ''; return false; }

function addPerson() {
  var n = $('pn').value.trim();
  if (!n) return perr('Escribe un nombre.');
  if (S.people.some(function (p) { return p.name.toLowerCase() === n.toLowerCase(); })) return perr('Ese nombre ya está en el grupo.');
  var p = { id: uid(), name: n };
  S.people.push(p); sel.add(p.id);
  $('pn').value = ''; perr(''); render();
}
function removePerson(id) {
  var used = S.expenses.some(function (e) { return e.payer === id || e.parts.indexOf(id) > -1; });
  if (used) return perr('No se puede quitar a ' + nm(id) + ': aparece en un gasto. Elimina o edita ese gasto primero.');
  S.people = S.people.filter(function (p) { return p.id !== id; });
  sel.delete(id); if (openId === id) openId = null; perr(''); render();
}

function setMode(m) {
  mode = m;
  $('m-equal').className = m === 'equal' ? 'on' : '';
  $('m-exact').className = m === 'exact' ? 'on' : '';
  renderParts();
}
function resetForm() {
  edit = null; ex = {};
  $('desc').value = ''; $('amt').value = '';
  $('ftitle').textContent = 'Nuevo gasto';
  $('save').textContent = 'Agregar gasto';
  $('cancel').style.display = 'none';
  sel = new Set(S.people.map(function (p) { return p.id; }));
  setMode('equal'); err('');
}

function saveExpense() {
  var d = $('desc').value.trim(), a = cents($('amt').value), payer = $('payer').value;
  if (S.people.length < 2) return err('Agrega al menos 2 personas.');
  if (!d) return err('Escribe qué se pagó.');
  if (a === null || a <= 0) return err('Monto inválido. Usa un número mayor que 0 con máximo 2 decimales.');
  var parts = S.people.filter(function (p) { return sel.has(p.id); }).map(function (p) { return p.id; });
  if (!parts.length) return err('Elige entre quiénes se divide.');
  var e = { id: edit || uid(), desc: d, amount: a, payer: payer, parts: parts, mode: mode };
  if (mode === 'exact') {
    var t = 0; e.exact = {};
    for (var i = 0; i < parts.length; i++) {
      var v = cents(ex[parts[i]] || '0');
      if (v === null) return err('Monto inválido en ' + nm(parts[i]) + '.');
      e.exact[parts[i]] = v; t += v;
    }
    if (t !== a) return err('Los montos suman ' + money(t) + ' y deben sumar ' + money(a) + '.');
  }
  if (edit) S.expenses = S.expenses.map(function (x) { return x.id === edit ? e : x; });
  else S.expenses.push(e);
  resetForm(); render();
}
function startEdit(id) {
  var e = S.expenses.find(function (x) { return x.id === id; });
  if (!e) return;
  edit = id; sel = new Set(e.parts); ex = {};
  if (e.exact) for (var k in e.exact) ex[k] = (e.exact[k] / 100).toFixed(2);
  $('desc').value = e.desc; $('amt').value = (e.amount / 100).toFixed(2); $('payer').value = e.payer;
  $('ftitle').textContent = 'Editando gasto';
  $('save').textContent = 'Guardar cambios';
  $('cancel').style.display = 'block';
  setMode(e.mode || 'equal'); err('');
  $('desc').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function summary() {
  var st = transfers(S.settle);
  var t = S.expenses.reduce(function (a, e) { return a + e.amount; }, 0);
  var L = ['*' + (S.group || 'Resumen de gastos') + '*', 'Total: ' + money(t), ''];
  S.expenses.forEach(function (e) { L.push('- ' + e.desc + ': ' + money(e.amount) + ' (pagó ' + nm(e.payer) + ')'); });
  L.push('', '*Para saldar cuentas*');
  if (!st.length) L.push('Todo saldado.');
  st.forEach(function (x) { L.push('- ' + nm(x[0]) + ' le paga ' + money(x[2]) + ' a ' + nm(x[1]) + (x[3] ? ' (' + x[3] + ')' : '')); });
  return L.join('\n');
}
function copyText(txt, btn) {
  function fb() {
    var ta = document.createElement('textarea');
    ta.value = txt; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).catch(fb); else fb();
  var bt = btn || $('copy'), old = bt.textContent; bt.textContent = 'Copiado';
  setTimeout(function () { bt.textContent = old; }, 1800);
}

$('gn').value = S.group;
$('gn').oninput = function () { S.group = $('gn').value.trim(); save(); };
$('smodes').onclick = function (e) { var m = e.target.getAttribute('data-s'); if (m) { S.settle = m; render(); } };
$('pcards').onclick = function (e) {
  var t = e.target, cp = t.closest('[data-copy]'), wa = t.closest('[data-wa]'), op = t.closest('[data-open]');
  var st = transfers(S.settle);
  if (cp) { copyText(personMsg(cp.getAttribute('data-copy'), st), cp); return; }
  if (wa) { window.open('https://wa.me/?text=' + encodeURIComponent(personMsg(wa.getAttribute('data-wa'), st)), '_blank'); return; }
  var ln = t.closest('[data-ln]');
  if (ln) { var key = ln.getAttribute('data-ln'); openLine = openLine === key ? null : key; renderPeople(st); return; }
  if (op) { var id = op.getAttribute('data-open'); openId = openId === id ? null : id; openLine = null; renderPeople(st); }
};
$('pcards').onkeydown = function (e) {
  var op = e.target.closest && e.target.closest('[data-open],[data-ln]');
  if (op && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); op.click(); }
};
$('detTog').onchange = function () { S.detail = $('detTog').checked; render(); };
$('addp').onclick = addPerson;
$('pn').onkeydown = function (e) { if (e.key === 'Enter') addPerson(); };
$('chips').onclick = function (e) { var id = e.target.getAttribute('data-del'); if (id) removePerson(id); };
$('m-equal').onclick = function () { setMode('equal'); };
$('m-exact').onclick = function () { setMode('exact'); };
$('parts').onchange = function (e) {
  var id = e.target.getAttribute('data-p');
  if (!id) return;
  if (e.target.checked) sel.add(id); else sel.delete(id);
  renderParts();
};
$('parts').oninput = function (e) { var id = e.target.getAttribute('data-e'); if (id) ex[id] = e.target.value; };
$('save').onclick = saveExpense;
$('cancel').onclick = function () { resetForm(); };
$('exps').onclick = function (e) {
  var r = e.target.getAttribute('data-rm'), d = e.target.getAttribute('data-edit');
  if (r && confirm('¿Eliminar este gasto?')) { S.expenses = S.expenses.filter(function (x) { return x.id !== r; }); if (edit === r) resetForm(); render(); }
  if (d) startEdit(d);
};
$('copy').onclick = function () { copyText(summary(), $('copy')); };
$('wa').onclick = function () { window.open('https://wa.me/?text=' + encodeURIComponent(summary()), '_blank'); };
$('reset').onclick = function () {
  if (confirm('¿Borrar personas y gastos? No se puede deshacer.')) { S = { people: [], expenses: [], group: '', settle: S.settle, detail: S.detail }; $('gn').value = ''; resetForm(); render(); }
};

render();
</script>
</body>
</html>
